<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Annuaire Collège</title>
<style>
:root{--bg:#0b1020;--card:#151c33;--card2:#1c2545;--tx:#e8ecff;--mut:#8f9bc4;--ac:#6c8cff;--ac2:#a56cff;--ok:#38d39f;--warn:#ffb84d;--bad:#ff5d73;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:radial-gradient(1000px 600px at 10% -10%,#25316b55,transparent),var(--bg);color:var(--tx);min-height:100vh}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--card2);border:1px solid #2c386a;border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
button{border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--card2);transition:.15s}
button:hover{filter:brightness(1.25)}.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));font-weight:600}.bad{background:#4a1f2c;color:#ffb3bd}.ok{background:#12413a;color:#8ff0cf}.warn{background:#4a3a16;color:#ffd994}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:1.3rem;margin:0}h1 span{background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button.on{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.card{background:var(--card);border:1px solid #232d57;border-radius:16px;padding:16px;margin-bottom:12px}
.login{max-width:380px;margin:12vh auto}.login .card{display:grid;gap:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input{flex:1;min-width:160px}.bar select{width:auto}
details{background:var(--card);border:1px solid #232d57;border-radius:14px;margin-bottom:8px;overflow:hidden}
summary{padding:12px 16px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}summary i{margin-left:auto;font-style:normal;color:var(--mut);font-weight:400}
.row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid #20295190}.row .n{flex:1}.row b{font-weight:600}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:#2b3770;color:#c9d3ff}.mut{color:var(--mut)}.small{font-size:.85rem}
.acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.acc .n{flex:1;min-width:180px}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}#modal.on{display:flex}
.box{background:var(--card);border:1px solid #2c386a;border-radius:18px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto;display:grid;gap:10px}
.box h2{margin:0}.chk{display:flex;flex-wrap:wrap;gap:6px}.chk label{background:var(--card2);padding:6px 10px;border-radius:8px;display:flex;gap:6px;align-items:center;font-size:.9rem}.chk input,.row input[type=checkbox]{width:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,80px);background:#222c58;padding:12px 18px;border-radius:12px;transition:.25s;z-index:10;max-width:90vw}#toast.on{transform:translate(-50%,0)}
.err{color:var(--bad)}
</style></head><body>
<div class="wrap" id="app"></div><div id="modal"></div><div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged,signOut,updatePassword,reauthenticateWithCredential,EmailAuthProvider} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,getDocs,addDoc,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyC-AwFYSfr9faq_pSKWFsVoo6bq_PDjssU",authDomain:"college-14f64.firebaseapp.com",projectId:"college-14f64",storageBucket:"college-14f64.firebasestorage.app",messagingSenderId:"536082179106",appId:"1:536082179106:web:4a2b3bd9077cac68d9967b"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const auth2=getAuth(initializeApp(firebaseConfig,'second')); // sert à créer des comptes sans déconnecter l'admin
const DEF_USER='admin',DEF_PW='Admin2026!',ADMIN_EMAIL='admin-root@college.app';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const ck=c=>{const m=/^(\d)EME(\d)$/i.exec(c);return m?(10-m[1])*100+ +m[2]:9999};
const fmt=c=>/^\dEME\d$/i.test(c)?c.replace(/EME/i,'e '):'Classe non indiquée';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3500)};
const dt=t=>t?.toDate?t.toDate().toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'medium'}):'jamais';
const pub=s=>({nom:s.nom||'',prenom:s.prenom||'',classe:s.classe||'',categorie:s.categorie||''});
const S={user:null,prof:null,admin:false,students:[],users:[],sel:new Set(),tab:'eleves',q:'',cls:'',msg:''};
let booting=false;

/* ---------- AUTH ---------- */
async function login(p,pw){
  p=p.trim().toLowerCase();S.msg='';
  const l=await getDoc(doc(db,'logins',p));
  if(!l.exists()){
    if(p===DEF_USER&&pw===DEF_PW){ // 1re connexion : création du compte admin
      booting=true;
      let c;try{c=await createUserWithEmailAndPassword(auth,ADMIN_EMAIL,pw)}catch(e){if(e.code==='auth/email-already-in-use')c=await signInWithEmailAndPassword(auth,ADMIN_EMAIL,pw);else{booting=false;throw e}}
      const uid=c.user.uid;
      const mm=await getDoc(doc(db,'meta','admin'));
      if(mm.exists()&&mm.data().uid!==uid){booting=false;await signOut(auth);throw new Error('Un admin existe déjà avec un autre compte. Supprime meta/admin dans Firestore puis réessaie.')}
      if(!mm.exists())await setDoc(doc(db,'meta','admin'),{uid});
      await setDoc(doc(db,'logins',DEF_USER),{email:ADMIN_EMAIL,uid});
      await setDoc(doc(db,'users',uid),{pseudo:DEF_USER,role:'admin',status:'active',mustChange:true,lastLogin:serverTimestamp()});
      booting=false;await enter(c.user);return;
    }
    throw new Error('Identifiants incorrects');
  }
  let c;try{c=await signInWithEmailAndPassword(auth,l.data().email,pw)}catch{throw new Error('Identifiants incorrects')}
  try{await updateDoc(doc(db,'users',c.user.uid),{lastLogin:serverTimestamp()})}catch{}
}
async function enter(u){
  try{
    const p=await getDoc(doc(db,'users',u.uid));
    if(!p.exists()){S.msg='Compte introuvable.';return signOut(auth)}
    S.prof={id:u.uid,...p.data()};S.admin=S.prof.role==='admin';
    if(!S.admin&&S.prof.status!=='active'){S.msg=S.prof.status==='suspended'?'Ton compte est suspendu.':'Ton compte est bloqué.';return signOut(auth)}
    S.user=u;S.msg='';await load();render();if(S.prof.mustChange)openSettings(true);
  }catch(e){console.error(e);S.msg='Erreur : '+e.message;signOut(auth)}
}
onAuthStateChanged(auth,u=>{if(booting)return;if(!u){S.user=null;S.prof=null;render()}else enter(u)});

async function load(){
  if(S.admin){
    const [a,b]=await Promise.all([getDocs(collection(db,'students')),getDocs(collection(db,'users'))]);
    S.students=a.docs.map(d=>({id:d.id,...d.data()}));
    S.users=b.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.role!=='admin').sort((x,y)=>x.pseudo.localeCompare(y.pseudo));
  }else{
    const a=await getDocs(collection(db,'shares',S.user.uid,'items'));
    S.students=a.docs.map(d=>({id:d.id,...d.data()}));
  }
}

/* ---------- RENDER ---------- */
function render(){
  const A=$('#app');
  if(!S.user){
    A.innerHTML=`<div class="login"><div class="card"><h1><span>Annuaire Collège</span></h1><div class="mut small">Connecte-toi</div>
    <input id="lp" placeholder="Nom d'utilisateur" autocomplete="username"><input id="lw" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <div class="err small" id="le">${esc(S.msg)}</div><button class="pri" data-a="login">Se connecter</button></div><div style="text-align:center;font-size:3rem;margin-top:18px">😊</div></div>`;return;
  }
  const tabs=S.admin?[['eleves','Élèves'],['comptes','Comptes'],['import','Importer']]:[['eleves','Mes élèves']];
  A.innerHTML=`<header><h1><span>Annuaire Collège</span></h1><div class="acc"><span class="mut small">${esc(S.prof.pseudo)}${S.admin?' · admin':''}</span><button data-a="settings">⚙ Paramètres</button><button data-a="logout">Déconnexion</button></div></header>
  <div class="tabs">${tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-k="${k}">${l}</button>`).join('')}</div><div id="main"></div>`;
  const M=$('#main');
  if(S.tab==='eleves'){
    const cl=[...new Set(S.students.map(s=>s.classe||'—'))].sort((a,b)=>ck(a)-ck(b));
    M.innerHTML=`<div class="bar"><input id="q" placeholder="Rechercher (nom, prénom, classe, catégorie, même une lettre)…" value="${esc(S.q)}">
    <select id="cf"><option value="">Toutes les classes</option>${cl.map(c=>`<option value="${c==='—'?'':c}" ${S.cls===c?'selected':''}>${fmt(c)}</option>`).join('')}</select>
    ${S.admin?`<button class="pri" data-a="addS">+ Élève</button><button data-a="shareSel">Partager…</button>`:''}</div>
    <div class="mut small" id="cnt" style="margin-bottom:8px"></div><div id="list"></div>`;
    if(S.admin===false&&!S.students.length)$('#list').innerHTML='<div class="card mut">Aucun élève partagé avec toi pour le moment. Demande à l\'administrateur.</div>';else drawList();
  }else if(S.tab==='comptes')drawAccounts();
  else if(S.tab==='import')M.innerHTML=`<div class="card"><h2 style="margin-top:0">Importer une liste</h2><p class="mut small">Colle la liste : une ligne par classe (ex. <b>6EME1</b>) puis un élève par ligne au format <b>NOM Prénom</b>.</p>
  <textarea id="imp" rows="12" placeholder="6EME1&#10;AMOO Busola&#10;..."></textarea><div class="acc" style="margin-top:10px"><button class="pri" data-a="import">Importer</button><button class="bad" data-a="wipe">Supprimer tous les élèves</button></div></div>`;
}
function drawList(){
  const q=norm(S.q);
  const L=S.students.filter(s=>(!S.cls||s.classe===S.cls)&&(!q||norm(`${s.nom} ${s.prenom} ${s.classe} ${s.categorie}`).includes(q)));
  const g={};L.forEach(s=>(g[s.classe||'—']??=[]).push(s));
  $('#cnt').textContent=`${L.length} élève(s)`;
  $('#list').innerHTML=Object.keys(g).sort((a,b)=>ck(a)-ck(b)).map(c=>`<details ${q||S.cls?'open':''}><summary>${fmt(c)} <i>${g[c].length}</i></summary>${g[c].sort((a,b)=>(a.nom+a.prenom).localeCompare(b.nom+b.prenom)).map(s=>`<div class="row">
  ${S.admin?`<input type="checkbox" data-a="sel" data-id="${s.id}" ${S.sel.has(s.id)?'checked':''}>`:''}<div class="n"><b>${esc(s.nom)}</b> ${esc(s.prenom)}${s.notes?' 📝':''}</div>${s.categorie?`<span class="tag">${esc(s.categorie)}</span>`:''}
  ${S.admin?`<button data-a="editS" data-id="${s.id}">✎</button><button class="bad" data-a="delS" data-id="${s.id}">🗑</button>`:''}</div>`).join('')}</details>`).join('')||'<div class="card mut">Aucun résultat.</div>';
}
function drawAccounts(){
  $('#main').innerHTML=`<div class="bar"><button class="pri" data-a="addU">+ Ajouter un compte</button><button data-a="shareSel" data-all="1">Partager des classes…</button></div>`+
  (S.users.map(u=>{const st=u.status||'active';return `<div class="card"><div class="acc"><div class="n"><b>${esc(u.pseudo)}</b> <span class="tag">${st==='active'?'actif':st==='suspended'?'suspendu':'bloqué'}</span>
  <div class="mut small">Dernière connexion : ${dt(u.lastLogin)} · ${(u.sharedIds||[]).length} élève(s) partagé(s)</div></div>
  <button data-a="shareTo" data-id="${u.id}">Partager</button><button data-a="unshare" data-id="${u.id}">Retirer tout</button>
  <button class="warn" data-a="susp" data-id="${u.id}">${st==='suspended'?'Réactiver':'Suspendre'}</button>
  <button class="warn" data-a="block" data-id="${u.id}">${st==='blocked'?'Débloquer':'Bloquer'}</button><button class="bad" data-a="delU" data-id="${u.id}">Supprimer</button></div></div>`}).join('')||'<div class="card mut">Aucun compte pour l\'instant.</div>');
}

/* ---------- MODAL ---------- */
const modal=h=>{const m=$('#modal');m.innerHTML=`<div class="box">${h}</div>`;m.classList.add('on')};
const close=()=>{$('#modal').classList.remove('on');$('#modal').innerHTML=''};
const classOpts=()=>{const a=new Set();for(let l=6;l>=3;l--)for(let n=1;n<=6;n++)a.add(l+'EME'+n);S.students.forEach(s=>s.classe&&a.add(s.classe));return [...a].sort((x,y)=>ck(x)-ck(y))};

function studentModal(id){
  const s=S.students.find(x=>x.id===id)||{};
  const cats=[...new Set(S.students.map(x=>x.categorie).filter(Boolean))];
  modal(`<h2>${id?'Modifier':'Ajouter'} un élève</h2><input id="sn" placeholder="NOM" value="${esc(s.nom)}"><input id="sp" placeholder="Prénom" value="${esc(s.prenom)}">
  <select id="sc">${classOpts().map(c=>`<option value="${c}" ${s.classe===c?'selected':''}>${fmt(c)}</option>`).join('')}</select>
  <input id="sk" list="cats" placeholder="Catégorie (optionnel)" value="${esc(s.categorie)}"><datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <textarea id="so" rows="5" placeholder="Notes…">${esc(s.notes)}</textarea><div class="acc"><button class="pri" data-a="saveS" data-id="${id||''}">Enregistrer</button><button data-a="close">Annuler</button></div>`);
}
function accountModal(){modal(`<h2>Nouveau compte</h2><input id="np" placeholder="Pseudo (sans espace)"><input id="nw" type="text" placeholder="Mot de passe (6 caractères min.)"><div class="err small" id="me"></div><div class="acc"><button class="pri" data-a="saveU">Créer</button><button data-a="close">Annuler</button></div>`)}
function shareModal(uid){
  modal(`<h2>Partager</h2><label class="small mut">Avec qui ?</label><select id="st"><option value="*">👥 Tout le monde (tous les comptes)</option>${S.users.map(u=>`<option value="${u.id}" ${u.id===uid?'selected':''}>${esc(u.pseudo)}</option>`).join('')}</select>
  <label class="small mut">Quoi ?</label><select id="sm"><option value="sel">La sélection (${S.sel.size} élève(s) coché(s))</option><option value="all">Tous les élèves</option><option value="cls">Des classes…</option></select>
  <div class="chk" id="sc2" style="display:none">${classOpts().map(c=>`<label><input type="checkbox" value="${c}">${fmt(c)}</label>`).join('')}</div>
  <div class="acc"><button class="pri" data-a="doShare">Partager</button><button data-a="close">Annuler</button></div>`);
}
function openSettings(first){
  modal(`<h2>Paramètres</h2>${first?'<div class="warn small card">Première connexion : change ton identifiant et ton mot de passe par défaut.</div>':''}
  <label class="small mut">Pseudo</label><input id="up" value="${esc(S.prof.pseudo)}"><label class="small mut">Nouveau mot de passe (laisser vide pour ne pas changer)</label><input id="un" type="password" placeholder="Nouveau mot de passe">
  <label class="small mut">Mot de passe actuel (obligatoire)</label><input id="uc" type="password"><div class="err small" id="me"></div><div class="acc"><button class="pri" data-a="saveSet">Enregistrer</button><button data-a="close">Fermer</button></div>`);
}

/* ---------- ACTIONS ---------- */
const parse=t=>{const out=[];let c='';for(let l of t.split(/\r?\n/)){l=l.trim();if(!l)continue;if(/^\dEME\d$/i.test(l)){c=l.toUpperCase();continue}
  const w=l.replace(/\?/g,'').split(/\s+/);let i=0;while(i<w.length&&w[i]===w[i].toUpperCase()&&/[A-ZÀ-Ý]/.test(w[i]))i++;i=i||1;
  out.push({nom:w.slice(0,i).join(' '),prenom:w.slice(i).join(' '),classe:c,categorie:'',notes:''})}return out};
async function chunked(items,fn){for(let i=0;i<items.length;i+=400){const b=writeBatch(db);items.slice(i,i+400).forEach(x=>fn(b,x));await b.commit()}}
async function shareTo(uid,ids){
  const u=S.users.find(x=>x.id===uid),have=new Set(u.sharedIds||[]),map=new Map(S.students.map(s=>[s.id,s]));
  const add=ids.filter(i=>!have.has(i)&&map.has(i));
  await chunked(add,(b,id)=>b.set(doc(db,'shares',uid,'items',id),pub(map.get(id))));
  u.sharedIds=[...have,...add];await updateDoc(doc(db,'users',uid),{sharedIds:u.sharedIds});
}
async function unshare(uid,ids){
  const u=S.users.find(x=>x.id===uid);ids=ids||u.sharedIds||[];
  await chunked(ids,(b,id)=>b.delete(doc(db,'shares',uid,'items',id)));
  u.sharedIds=(u.sharedIds||[]).filter(i=>!ids.includes(i));await updateDoc(doc(db,'users',uid),{sharedIds:u.sharedIds});
}
const V=id=>$('#'+id)?.value??'';
const actions={
  async login(){try{await login(V('lp'),V('lw'))}catch(e){$('#le').textContent=e.code==='auth/operation-not-allowed'?'Active Email/Mot de passe dans Firebase Authentication.':e.message}},
  logout(){signOut(auth)},close,
  tab(e){S.tab=e.dataset.k;render()},
  settings(){openSettings()},
  sel(e){e.checked?S.sel.add(e.dataset.id):S.sel.delete(e.dataset.id)},
  addS(){studentModal()},editS(e){studentModal(e.dataset.id)},
  async saveS(e){
    const id=e.dataset.id,d={nom:V('sn').trim().toUpperCase(),prenom:V('sp').trim(),classe:V('sc'),categorie:V('sk').trim(),notes:V('so').trim()};
    if(!d.nom)return toast('Nom obligatoire');
    if(id){await updateDoc(doc(db,'students',id),d);Object.assign(S.students.find(x=>x.id===id),d);
      for(const u of S.users)if((u.sharedIds||[]).includes(id))await setDoc(doc(db,'shares',u.id,'items',id),pub(d));}
    else{const r=await addDoc(collection(db,'students'),d);S.students.push({id:r.id,...d})}
    close();drawList();toast('Enregistré');
  },
  async delS(e){const id=e.dataset.id;if(!confirm('Supprimer cet élève ?'))return;await deleteDoc(doc(db,'students',id));
    for(const u of S.users)if((u.sharedIds||[]).includes(id))await unshare(u.id,[id]);
    S.students=S.students.filter(x=>x.id!==id);S.sel.delete(id);drawList()},
  async import(){const l=parse(V('imp'));if(!l.length)return toast('Rien à importer');if(!confirm(`Importer ${l.length} élèves ?`))return;
    await chunked(l,(b,s)=>b.set(doc(collection(db,'students')),s));await load();toast(l.length+' élèves importés');S.tab='eleves';render()},
  async wipe(){if(!confirm('Supprimer TOUS les élèves ?'))return;await chunked(S.students,(b,s)=>b.delete(doc(db,'students',s.id)));
    for(const u of S.users)await unshare(u.id);await load();toast('Liste vidée');render()},
  addU(){accountModal()},
  async saveU(){
    const p=V('np').trim().toLowerCase(),w=V('nw');
    try{
      if(!/^[a-z0-9._-]{2,30}$/.test(p))throw new Error('Pseudo invalide (lettres, chiffres, . _ -)');
      if(w.length<6)throw new Error('Mot de passe trop court');
      if((await getDoc(doc(db,'logins',p))).exists())throw new Error('Pseudo déjà pris');
      const email=`u${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}@college.app`;
      const c=await createUserWithEmailAndPassword(auth2,email,w);const uid=c.user.uid;await signOut(auth2);
      await setDoc(doc(db,'users',uid),{pseudo:p,role:'user',status:'active',sharedIds:[],lastLogin:null});
      await setDoc(doc(db,'logins',p),{email,uid});
      await load();close();drawAccounts();toast('Compte créé : '+p);
    }catch(e){$('#me').textContent=e.message}
  },
  shareTo(e){shareModal(e.dataset.id)},
  shareSel(e){shareModal();if(e.dataset.all)$('#sm').value='cls',$('#sc2').style.display='flex'},
  async doShare(){
    const t=V('st'),m=V('sm');let ids;
    if(m==='all')ids=S.students.map(s=>s.id);
    else if(m==='sel')ids=[...S.sel];
    else{const cs=[...document.querySelectorAll('#sc2 input:checked')].map(x=>x.value);ids=S.students.filter(s=>cs.includes(s.classe)).map(s=>s.id)}
    if(!ids.length)return toast('Rien à partager');
    const targets=t==='*'?S.users.map(u=>u.id):[t];
    for(const uid of targets)await shareTo(uid,ids);
    close();S.sel.clear();if(S.tab==='comptes')drawAccounts();else drawList();toast(`${ids.length} élève(s) partagé(s)`);
  },
  async unshare(e){if(confirm('Retirer tous les élèves partagés à ce compte ?')){await unshare(e.dataset.id);drawAccounts()}},
  async susp(e){const u=S.users.find(x=>x.id===e.dataset.id);u.status=u.status==='suspended'?'active':'suspended';await updateDoc(doc(db,'users',u.id),{status:u.status});drawAccounts()},
  async block(e){const u=S.users.find(x=>x.id===e.dataset.id);u.status=u.status==='blocked'?'active':'blocked';await updateDoc(doc(db,'users',u.id),{status:u.status});drawAccounts()},
  async delU(e){const u=S.users.find(x=>x.id===e.dataset.id);if(!confirm('Supprimer le compte '+u.pseudo+' ?'))return;
    await unshare(u.id);await deleteDoc(doc(db,'logins',u.pseudo));await deleteDoc(doc(db,'users',u.id));S.users=S.users.filter(x=>x!==u);drawAccounts()},
  async saveSet(){
    try{
      const np=V('up').trim().toLowerCase(),nw=V('un'),cur=V('uc');
      if(!cur)throw new Error('Mot de passe actuel requis');
      const cu=auth.currentUser;
      try{await reauthenticateWithCredential(cu,EmailAuthProvider.credential(cu.email,cur))}catch{throw new Error('Mot de passe actuel incorrect')}
      if(np!==S.prof.pseudo){
        if(!/^[a-z0-9._-]{2,30}$/.test(np))throw new Error('Pseudo invalide');
        if((await getDoc(doc(db,'logins',np))).exists())throw new Error('Pseudo déjà pris');
        await setDoc(doc(db,'logins',np),{email:cu.email,uid:cu.uid});await deleteDoc(doc(db,'logins',S.prof.pseudo));
        await updateDoc(doc(db,'users',cu.uid),{pseudo:np});S.prof.pseudo=np;
      }
      if(nw){if(nw.length<6)throw new Error('Mot de passe trop court');await updatePassword(cu,nw)}
      if(S.prof.mustChange){await updateDoc(doc(db,'users',cu.uid),{mustChange:false});S.prof.mustChange=false}
      close();render();toast('Paramètres enregistrés');
    }catch(e){$('#me').textContent=e.message}
  }
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=actions[t.dataset.a];if(f)Promise.resolve().then(()=>f(t)).catch(x=>{console.error(x);toast('Erreur : '+x.message)})});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;drawList()}});
document.addEventListener('change',e=>{if(e.target.id==='cf'){S.cls=e.target.value;drawList()}if(e.target.id==='sm')$('#sc2').style.display=e.target.value==='cls'?'flex':'none'});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lw')actions.login()});
render();
</script></body></html>
